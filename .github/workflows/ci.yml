name: Compatibility CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Windows, arch: x64, runner: windows-2025 }
          - { os: Windows, arch: arm64, runner: windows-11-arm }
          - { os: Linux, arch: x64, runner: ubuntu-24.04 }
          - { os: Linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: macOS, arch: x64, runner: macos-15-intel }
          - { os: macOS, arch: arm64, runner: macos-15 }
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LIBMIDI_EXPECTED_OS: ${{ matrix.os }}
      LIBMIDI_EXPECTED_ARCH: ${{ matrix.arch }}
      LIBMIDI_ENVIRONMENT_LOG: ${{ github.workspace }}/TestResults/environment.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create diagnostics directory
        run: New-Item -ItemType Directory -Path TestResults -Force | Out-Null
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/libmidi-dotnet
        with:
          global-json-file: global.json
          architecture: ${{ matrix.arch }}
          skip-lts-prepass: true
      - name: Record SDK
        run: |
          $sdk = dotnet --version 2>&1
          $versionExit = $LASTEXITCODE
          $sdk | Tee-Object -FilePath TestResults/sdk.txt
          if ($versionExit -ne 0) { exit $versionExit }
          dotnet --info 2>&1 | Tee-Object -FilePath TestResults/sdk.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = (Get-Content -Raw global.json | ConvertFrom-Json).sdk.version
          if ($sdk -ne $expected) { throw "Expected SDK $expected, observed $sdk" }
      - name: Restore
        run: dotnet restore libMidi.sln 2>&1 | Tee-Object -FilePath TestResults/restore.txt
      - name: Build
        run: dotnet build libMidi.sln -c Release --no-restore 2>&1 | Tee-Object -FilePath TestResults/build.txt
      - name: Test the just-built package and assembly
        run: |
          dotnet test libMidi.sln -c Release --no-build --no-restore --logger 'trx;LogFileName=libMidi.trx' --results-directory TestResults 2>&1 |
            Tee-Object -FilePath TestResults/test.txt
      - name: Store verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.arch }}
          path: TestResults/
          if-no-files-found: warn
